<!doctype html><meta charset=utf-8><title>plain</title>
<style>html,body{margin:0;height:100%;background:#123}</style>
<script>
// No GPU use: for tests of JS error handling and frame pacing on any machine.
const p = new URLSearchParams(location.search);
let frames = 0;
function frame() { frames++; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.frameCount = () => frames;
window.inputLog = [];
for (const t of ['pointerdown', 'pointerup', 'wheel', 'keydown']) addEventListener(t, (e) => inputLog.push(t + (e.key ? ':' + e.key : '')));
if (p.has('reject')) Promise.reject(new Error('async boom'));
if (p.has('throw')) setTimeout(() => { null.boom(); }, 100);
</script>
